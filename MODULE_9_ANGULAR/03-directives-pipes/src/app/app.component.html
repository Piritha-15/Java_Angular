<h2>Available Courses</h2>
<p *ngIf="isLoading">Loading courses...</p>
<div *ngFor="let course of courses" class="card">
  <h3>{{ course.name | uppercase }}</h3>
  <p>{{ course.credits | creditLabel }}</p>
  <span [ngSwitch]="course.gradeStatus">
    <b *ngSwitchCase="'passed'">Passed</b>
    <b *ngSwitchCase="'failed'">Failed</b>
    <b *ngSwitchDefault>Pending</b>
  </span>
</div>
